<div>
  <button
    type="button"
    (click)="abrir()"
    aria-label="Elegir fecha"
    class="flex h-14 w-full items-center justify-between rounded-2xl bg-gray-50 dark:bg-gray-800 px-4 text-left text-gray-900 dark:text-white outline-none ring-1 ring-transparent focus:ring-2 focus:ring-blue-500"
  >
    <span class="flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="h-5 w-5 shrink-0 text-blue-600 dark:text-blue-400">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
      </svg>
      <span [class.text-gray-400]="!valor()">{{ fechaSeleccionada() }}</span>
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4 w-4 text-gray-400">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </button>

  @if (abierto()) {
    <div
      class="fixed inset-0 z-50 flex items-end justify-center bg-black/50 backdrop-blur-sm sm:items-center"
      (click)="cerrar()"
    >
      <div
        class="w-full rounded-t-3xl bg-white p-6 pb-8 shadow-2xl dark:bg-gray-900 sm:max-w-md sm:rounded-3xl"
        (click)="$event.stopPropagation()"
      >
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold text-gray-900 dark:text-white">Elige una fecha</h2>
          <button
            type="button"
            aria-label="Cerrar"
            (click)="cerrar()"
            class="flex h-9 w-9 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 active:scale-95"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="mt-5 flex items-center justify-between">
          <button
            type="button"
            aria-label="Mes anterior"
            (click)="cambiarMes(-1)"
            class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 active:scale-95"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
          </button>
          <span class="text-base font-bold text-gray-900 dark:text-white">{{ etiquetaMes() }}</span>
          <button
            type="button"
            aria-label="Mes siguiente"
            (click)="cambiarMes(1)"
            class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 active:scale-95"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </button>
        </div>

        <div class="mt-4 grid grid-cols-7 gap-1 text-center">
          @for (d of diasSemana; track $index) {
            <span class="text-xs font-bold uppercase text-gray-400 dark:text-gray-500">{{ d }}</span>
          }
        </div>

        <div class="mt-2 grid grid-cols-7 gap-1">
          @for (dia of diasCalendario(); track $index) {
<button
              type="button"
              (click)="elegirDia(dia)"
              [disabled]="!dia.fecha"
              [class]="
                esSeleccionado(dia.fecha)
                  ? 'flex h-10 items-center justify-center rounded-xl bg-blue-600 text-sm font-bold text-white shadow-lg shadow-blue-600/30 active:scale-95'
                  : dia.fecha
                    ? (dia.hoy
                      ? 'flex h-10 items-center justify-center rounded-xl text-sm font-bold text-blue-600 dark:text-blue-400 ring-2 ring-inset ring-blue-300 dark:ring-blue-500/40 active:scale-95 active:bg-gray-100 dark:active:bg-gray-700'
                      : 'flex h-10 items-center justify-center rounded-xl text-sm font-medium text-gray-700 dark:text-white active:scale-95 active:bg-gray-100 dark:active:bg-gray-700')
                    : 'flex h-10 items-center justify-center text-sm font-medium text-gray-300 dark:text-gray-600'
              "
            >
              {{ dia.numero }}
            </button>
          }
        </div>

        <button
          type="button"
          (click)="irAHoy()"
          class="mt-4 h-12 w-full rounded-2xl border border-gray-200 dark:border-gray-700 text-sm font-semibold text-gray-700 dark:text-gray-200 active:scale-[0.98]"
        >
          Ir a hoy
        </button>
      </div>
    </div>
  }
</div>
