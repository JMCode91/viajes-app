<div class="min-h-screen flex items-center justify-center px-6 py-10 bg-gradient-to-br from-blue-50 via-white to-gray-100 dark:from-gray-900 dark:via-gray-900 dark:to-black">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-3xl bg-blue-600 text-white shadow-xl shadow-blue-600/30">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-8 w-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h10.5m-10.5 10.5h10.5M6.75 12h10.5" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Crear cuenta</h1>
      <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Empieza a organizar tu próximo viaje.</p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-5 rounded-3xl bg-white dark:bg-gray-900 p-8 shadow-xl shadow-gray-200/50 dark:shadow-none border border-gray-100 dark:border-gray-800"
    >
      <div class="flex flex-col gap-2">
        <label for="nombre" class="text-sm font-medium text-gray-700 dark:text-gray-300">Nombre de usuario</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          autocomplete="name"
          placeholder="Tu nombre"
          class="h-14 rounded-2xl bg-gray-50 dark:bg-gray-800 px-4 text-base text-gray-900 dark:text-white placeholder-gray-400 outline-none border border-transparent focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
        />
        @if (hasError('nombre')) {
          <span class="text-xs text-red-600">El nombre es obligatorio (máx. 150).</span>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-gray-700 dark:text-gray-300">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@email.com"
          class="h-14 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent px-4 text-base text-gray-900 dark:text-white placeholder-gray-400 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
        />
        @if (hasError('email')) {
          <span class="text-xs text-red-600">Introduce un email válido.</span>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label for="password" class="text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Mínimo 6 caracteres"
          class="h-14 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent px-4 text-base text-gray-900 dark:text-white outline-none placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
        />
        @if (hasError('password')) {
          <span class="text-xs text-red-600">Mínimo 6 caracteres.</span>
        }
      </div>

      <button
        type="submit"
        class="mt-2 h-14 w-full rounded-2xl bg-blue-600 text-base font-semibold text-white shadow-lg shadow-blue-600/30 active:scale-[0.98] active:bg-blue-700"
      >
        Crear cuenta
      </button>
    </form>

    <p class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="font-semibold text-blue-600 dark:text-blue-400">Inicia sesión</a>
    </p>
  </div>
</div>
