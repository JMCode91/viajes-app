<div
  class="relative min-h-screen w-full bg-cover bg-center"
  style="background-image: url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=2070&auto=format&fit=crop');"
>
  <div class="absolute inset-0 bg-black/50"></div>

  <div
    class="relative z-10 flex min-h-screen items-center justify-center px-6 py-10"
  >
    <div class="w-full max-w-md">
      <div class="mb-10 text-center">
        <div
          class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-white/10 text-white ring-1 ring-white/30 backdrop-blur-md"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-8 w-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"
            />
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-white">Prepara las maletas</h1>
        <p class="mt-2 text-sm text-white/70">
          Accede a tus viajes y sigue planificando.
        </p>
      </div>

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="flex flex-col gap-5 rounded-3xl border border-white/20 bg-white/10 p-8 shadow-2xl backdrop-blur-md"
      >
        <div class="flex flex-col gap-2">
          <label
            for="email"
            class="text-sm font-medium text-white/90"
          >
            Email
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="tu@email.com"
            class="h-14 rounded-2xl border border-white/30 bg-white/20 px-4 text-white placeholder-gray-300 outline-none backdrop-blur-sm transition-colors focus:border-blue-400 focus:ring-2 focus:ring-blue-500/50"
          />
          @if (hasError('email')) {
            <span class="text-xs text-red-300">Introduce un email válido.</span>
          }
        </div>

        <div class="flex flex-col gap-2">
          <label
            for="password"
            class="text-sm font-medium text-white/90"
          >
            Contraseña
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="h-14 rounded-2xl border border-white/30 bg-white/20 px-4 text-base text-white placeholder-gray-300 outline-none backdrop-blur-sm transition-colors focus:border-blue-400 focus:ring-2 focus:ring-blue-500/50"
          />
          @if (hasError('password')) {
            <span class="text-xs text-red-300">La contraseña es obligatoria.</span>
          }
        </div>

        @if (mensajeError) {
          <div
            class="rounded-xl border border-red-500 bg-red-500/10 p-3 text-red-500"
          >
            {{ mensajeError }}
          </div>
        }

        <button
          type="submit"
          [disabled]="logueando"
          class="mt-2 h-14 w-full rounded-2xl bg-blue-600 text-base font-semibold text-white shadow-lg shadow-blue-600/40 transition-colors hover:bg-blue-700 active:scale-[0.98] disabled:opacity-60 disabled:shadow-none disabled:active:scale-100"
        >
          {{ logueando ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>

      <div class="mt-6 border-t border-white/20 pt-6">
        <p
          class="mb-3 text-center text-xs font-medium uppercase tracking-wide text-white/60"
        >
          Acceso rápido de desarrollo
        </p>
        <div class="flex flex-wrap justify-center gap-4">
          <button
            type="button"
            (click)="accesoRapido('javi')"
            class="flex h-10 items-center gap-2 rounded-full border border-white/20 bg-white/10 px-5 text-sm font-medium text-white backdrop-blur-sm transition-colors hover:bg-white/20 active:scale-95"
          >
            Entrar como Javi
          </button>
          <button
            type="button"
            (click)="accesoRapido('cynthia')"
            class="flex h-10 items-center gap-2 rounded-full border border-white/20 bg-white/10 px-5 text-sm font-medium text-white backdrop-blur-sm transition-colors hover:bg-white/20 active:scale-95"
          >
            Entrar como Cynthia
          </button>
        </div>
      </div>

      <p class="mt-8 text-center text-sm text-white/70">
        ¿Aún no tienes cuenta?
        <a
          routerLink="/registro"
          class="font-semibold text-white underline decoration-white/40 underline-offset-2"
        >
          Regístrate
        </a>
      </p>
    </div>
  </div>
</div>
