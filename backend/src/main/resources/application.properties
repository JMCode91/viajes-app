# =====================================================================
# Configuracion de la aplicacion backend - Fase 1
# Conexion a PostgreSQL + PostGIS levantado via Docker
# (ver infra/docker-compose.yml para las credenciales por defecto).
# =====================================================================

# --- Conexion a la base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/viajes_app_db
spring.datasource.username=viajes_app
spring.datasource.password=viajes_app_secreto_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
# 'update' crea/actualiza el esquema automaticamente en desarrollo.
# En produccion se recomienda 'validate' con migraciones controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
