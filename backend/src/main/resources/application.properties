# =====================================================================
# Configuracion de la aplicacion backend - Fase 1
# Conexion a PostgreSQL + PostGIS levantado via Docker
# (ver infra/docker-compose.yml para las credenciales por defecto).
# =====================================================================

# --- Conexion a la base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5435/viajes_app_db
spring.datasource.username=${MI_USUARIO}
spring.datasource.password=${MI_CONTRASENA}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
# 'update' crea/actualiza el esquema automaticamente en desarrollo.
# En produccion se recomienda 'validate' con migraciones controladas.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Clave secreta de firma (al menos 256 bits => 32 caracteres base64 para HS256).
# Solo para desarrollo local; debe sobrescribirse via variables de entorno en produccion.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# --- Subida de archivos (Prevencion DoS / Agotamiento de recursos) ---
# Limite de tamano maximo por archivo y por peticion: 5MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=5MB

# Directorio local donde se almacenan los archivos seguros.
app.upload.dir=./uploads

# --- Cloudflare R2 (almacenamiento S3) ---
# Credenciales y configuracion del bucket R2. Placeholders de desarrollo;
# rellenar con los valores reales (y sobrescribir via variables de entorno
# en produccion): cloudflare.r2.access-key, cloudflare.r2.secret-key,
# cloudflare.r2.endpoint, cloudflare.r2.bucket, cloudflare.r2.public-url.
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.bucket=${R2_BUCKET:app-viajes}
cloudflare.r2.public-url=${R2_PUBLIC_URL}


# --- Inicializacion de datos (data.sql) ---
# Ejecuta data.sql despues de que Hibernate cree/actualice el esquema.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Configuracion de Gemini ---
gemini.api.key=${GEMINI_API_KEY}

# --- Configuracion de Google Cloud Translation (Basic v2) ---
# Misma clave de Google Cloud (la de Maps/Gemini) con el permiso de Cloud
# Translation API habilitado en la consola. Se usa en /api/ia/traducir.
google.api.key=${GOOGLE_PLACES_API_KEY}

# --- Configuracion de Google Maps Platform (Places) ---
# Clave usada para enriquecer los viajes generados por IA con el googlePlaceId
# oficial via Text Search (findplacefromtext). Si no se define, se reutiliza
# temporalmente la clave de Gemini, que puede compartir proyecto en la misma
# consola de Google Cloud.
google.places.api.key=${GOOGLE_PLACES_API_KEY}

# --- Spring Mail (confirmacion de registro por email) ---
# Valores dummy de desarrollo (Mailtrap). El contexto de Spring arranca con
# estos valores aunque el SMTP no este accesible: el envio se degrada con un
# log de error en lugar de abortar la transaccion (EmailServiceImpl).
# Sobrescribir con los valores reales (y via variables de entorno) en produccion.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=truenano 

# --- Frontend (enlaces en los correos) ---
# URL base del frontend que se inyecta en los correos (verificacion de cuenta).
# En produccion se sobrescribe con la URL real via variable de entorno
# (app.frontend.url o FRONTEND_URL).
app.frontend.url=http://localhost:4200 