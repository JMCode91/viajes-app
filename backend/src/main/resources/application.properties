# =====================================================================
# Configuracion de la aplicacion backend - Fase 1
# Conexion a PostgreSQL + PostGIS levantado via Docker
# (ver infra/docker-compose.yml para las credenciales por defecto).
# =====================================================================

# --- Conexion a la base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5435/viajes_app_db
spring.datasource.username=${MI_USUARIO}
spring.datasource.password=${MI_CONTRASENA}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
# 'update' crea/actualiza el esquema automaticamente en desarrollo.
# En produccion se recomienda 'validate' con migraciones controladas.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Clave secreta de firma (al menos 256 bits => 32 caracteres base64 para HS256).
# Solo para desarrollo local; debe sobrescribirse via variables de entorno en produccion.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# --- Subida de archivos (Prevencion DoS / Agotamiento de recursos) ---
# Limite de tamano maximo por archivo y por peticion: 5MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Directorio local donde se almacenan los archivos seguros.
app.upload.dir=./uploads

# --- Cloudflare R2 (almacenamiento S3) ---
# Credenciales y configuracion del bucket R2. Placeholders de desarrollo;
# rellenar con los valores reales (y sobrescribir via variables de entorno
# en produccion): cloudflare.r2.access-key, cloudflare.r2.secret-key,
# cloudflare.r2.endpoint, cloudflare.r2.bucket, cloudflare.r2.public-url.
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.bucket=${R2_BUCKET:app-viajes}
cloudflare.r2.public-url=${R2_PUBLIC_URL}

# --- Traduccion (DeepL) ---
# API key de DeepL. Placeholder de desarrollo; sobrescribir via variable
# de entorno en produccion (deepl.api.key). Si no se define, el endpoint
# /api/diccionario/traducir devuelve 503 con mensaje claro.
deepl.api.key=

# --- Inicializacion de datos (data.sql) ---
# Ejecuta data.sql despues de que Hibernate cree/actualice el esquema.
spring.jpa.defer-datasource-initialization=true

# --- Configuracion de Gemini ---
gemini.api.key=${GEMINI_API_KEY}