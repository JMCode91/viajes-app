# =====================================================================
# Configuracion de la aplicacion backend - Fase 1
# Conexion a PostgreSQL + PostGIS levantado via Docker
# (ver infra/docker-compose.yml para las credenciales por defecto).
# =====================================================================

# --- Conexion a la base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/viajes_app_db
spring.datasource.username=viajes_app
spring.datasource.password=viajes_app_secreto_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
# 'update' crea/actualiza el esquema automaticamente en desarrollo.
# En produccion se recomienda 'validate' con migraciones controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Clave secreta de firma (al menos 256 bits => 32 caracteres base64 para HS256).
# Solo para desarrollo local; debe sobrescribirse via variables de entorno en produccion.
app.jwt.secret=Y2xhZmVkZWx2aWFqZXNfMmU0ZmM3MDUxY2ZmM2Y5Mjg4YzA0ZGI3Y2E1ZjE2
app.jwt.expiration=86400000

# --- Subida de archivos (Prevencion DoS / Agotamiento de recursos) ---
# Limite de tamano maximo por archivo y por peticion: 5MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Directorio local donde se almacenan los archivos seguros.
app.upload.dir=./uploads

# --- Traduccion (DeepL) ---
# API key de DeepL. Placeholder de desarrollo; sobrescribir via variable
# de entorno en produccion (deepl.api.key). Si no se define, el endpoint
# /api/diccionario/traducir devuelve 503 con mensaje claro.
deepl.api.key=

# --- Inicializacion de datos (data.sql) ---
# Ejecuta data.sql despues de que Hibernate cree/actualice el esquema.
spring.jpa.defer-datasource-initialization=true
